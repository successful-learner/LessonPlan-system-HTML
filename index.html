<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0">
<title>Lesson Plan Builder v10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
--pri:#2d2d2d;--accent:#6c5ce7;--accent-l:#f3effe;--accent-d:#5a4bd1;
--green:#10b981;--green-l:#ecfdf5;--rose:#f43f5e;--rose-l:#fef1f3;
--amber:#f59e0b;--amber-l:#fefce8;--blue:#4a7dff;--blue-l:#eef3ff;
--purple:#8b5cf6;--purple-l:#f3effe;--teal:#14b8a6;--teal-l:#f0fdfa;
--g0:#fff;--g50:#fafafa;--g100:#f5f5f5;--g150:#efefef;--g200:#e5e5e5;--g300:#d4d4d4;--g400:#a3a3a3;--g500:#737373;--g600:#525252;--g700:#404040;--g800:#262626;--g900:#171717;
--r:20px;--rs:14px;--rx:10px;
--sh:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
--sh-lg:0 4px 24px rgba(0,0,0,.08),0 12px 48px rgba(0,0,0,.06);
--font:'Inter','Noto Sans TC',-apple-system,sans-serif;
--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:#f0f0f5;color:var(--g800);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:110px;overflow-x:hidden}
.container{max-width:480px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.container{max-width:560px;padding:0 24px}}
.btm-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;padding:0 16px env(safe-area-inset-bottom,8px)}
.btm-nav-inner{max-width:420px;margin:0 auto 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 8px 40px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:space-around;padding:6px 8px}
.btm-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border:none;background:transparent;color:var(--g400);font-size:10px;font-weight:500;cursor:pointer;transition:.25s var(--ease);border-radius:16px;min-width:48px;position:relative}
.btm-item.active{color:var(--accent);font-weight:700}
.btm-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:3px;background:var(--accent)}
.btm-item .bi-ico{font-size:20px;line-height:1;transition:.2s}
.hero-card{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 40%,#0f3460 100%);border-radius:24px;padding:28px 24px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 32px rgba(15,52,96,.3)}
.hero-card::before{content:'';position:absolute;top:-60%;right:-30%;width:250px;height:250px;background:radial-gradient(circle,rgba(108,92,231,.25) 0%,transparent 70%);border-radius:50%}
.hero-stat{position:relative;z-index:1}
.hero-num{font-size:48px;font-weight:900;letter-spacing:-2px;line-height:1}
.hero-sub{font-size:13px;opacity:.5;margin-top:4px}
.hero-label{font-size:12px;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.m-card{background:var(--g0);border-radius:var(--r);padding:18px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid rgba(0,0,0,.04);transition:box-shadow .25s var(--ease)}
.m-card-hover:hover{box-shadow:var(--sh-lg)}
.m-input{width:100%;border:1.5px solid var(--g200);border-radius:12px;padding:11px 14px;font-size:14px;font-family:var(--font);background:var(--g50);transition:.25s var(--ease)}
.m-input:focus{border-color:var(--accent);outline:none;background:var(--g0);box-shadow:0 0 0 4px rgba(108,92,231,.1)}
.m-textarea{width:100%;border:1.5px solid var(--g200);border-radius:12px;padding:12px 14px;font-size:14px;font-family:var(--font);resize:vertical;min-height:60px;background:var(--g50);transition:.25s var(--ease)}
.m-textarea:focus{border-color:var(--accent);outline:none;background:var(--g0);box-shadow:0 0 0 4px rgba(108,92,231,.1)}
.m-select{width:100%;border:1.5px solid var(--g200);border-radius:12px;padding:11px 14px;font-size:14px;font-family:var(--font);background:var(--g50);appearance:none;transition:.25s var(--ease)}
.m-select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px rgba(108,92,231,.1)}
.btn{padding:13px 18px;border:none;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-dark{background:var(--g900);color:#fff}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 4px 16px rgba(108,92,231,.3)}
.btn-outline{background:transparent;color:var(--g700);border:1.5px solid var(--g200)}
.btn-ghost{background:var(--g100);color:var(--g700)}
.btn-danger{background:var(--rose);color:#fff}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);color:#fff;box-shadow:0 4px 16px rgba(16,185,129,.3)}
.btn-sm{padding:8px 14px;font-size:12px;width:auto;border-radius:10px}
.btn-xs{padding:5px 10px;font-size:11px;width:auto;border-radius:8px}
.pg-back{width:40px;height:40px;border-radius:50%;background:var(--g0);border:1px solid var(--g100);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:.2s}
.pg-back:active{background:var(--g100);transform:scale(.92)}
.label{font-size:11px;color:var(--g500);font-weight:600;margin-bottom:5px;display:block;letter-spacing:.3px}
.chip{display:inline-flex;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700}
.chip-rope{background:#fff7ed;color:#c2410c}
.chip-gym{background:var(--purple-l);color:var(--purple)}
.chip-mixed{background:var(--teal-l);color:#0d9488}
.seg-card{background:var(--g0);border-radius:16px;border:1px solid var(--g100);margin-bottom:8px;overflow:hidden;border-left:4px solid var(--accent)}
.seg-head{padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.seg-head:active{background:var(--g50)}
.seg-body{padding:0 16px 16px;border-top:1px solid var(--g100);display:none}
.seg-body.show{display:block;padding-top:14px}
.stu-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:600;margin:2px}
.stu-tag-basic{background:#dbeafe;color:#1d4ed8}
.stu-tag-standard{background:#d1fae5;color:#065f46}
.stu-tag-challenge{background:#fce7f3;color:#9d174d}
.stu-tag-simplified{background:#fef3c7;color:#92400e}
.teach-seg{background:var(--g0);border-radius:24px;padding:24px;margin-bottom:12px;box-shadow:var(--sh-lg)}
.teach-stu-card{background:var(--g50);border-radius:16px;padding:14px;margin-top:8px;border-left:3px solid var(--accent);transition:.2s}
.teach-stu-card.att-absent{opacity:.35;border-left-color:var(--g300)}
.reflect-stu{background:var(--g0);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--g100)}
.report-card{background:var(--g0);border-radius:24px;padding:24px;box-shadow:var(--sh-lg);border:2px solid var(--accent);margin-bottom:12px}
.report-card h3{font-size:16px;font-weight:800;margin-bottom:14px;color:var(--accent)}
.report-stu{padding:12px 0;border-bottom:1px solid var(--g100)}
.report-stu:last-child{border:none}
.share-card{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);border-radius:24px;padding:24px;color:#fff;margin-bottom:12px;box-shadow:0 8px 32px rgba(15,52,96,.3)}
.share-seg{background:rgba(255,255,255,.08);border-radius:14px;padding:14px;margin-bottom:8px;border:1px solid rgba(255,255,255,.06)}
.share-link-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:10px;background:rgba(108,92,231,.3);color:#c4b5fd;font-size:12px;font-weight:600;text-decoration:none;border:1px solid rgba(108,92,231,.4)}
.video-field{background:linear-gradient(135deg,#faf5ff,#ede9fe);border-radius:12px;padding:12px;margin-bottom:10px;border:1px solid #e9d5ff}
.att-bar{background:var(--green-l);border-radius:14px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.2s;border:1px solid rgba(16,185,129,.15)}
.att-bar:active{background:#d1fae5}
.att-bar.warn{background:var(--amber-l);border-color:rgba(245,158,11,.15)}
.fade-in{animation:fadeIn .35s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.slide-up{animation:slideUp .4s var(--ease)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--g900);color:#fff;padding:12px 24px;border-radius:24px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.2);max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.25s}
.modal-ov.show{opacity:1;pointer-events:auto}
.modal-bx{background:var(--g0);border-radius:28px;padding:32px;max-width:340px;width:100%;text-align:center;box-shadow:var(--sh-lg)}
.modal-bx h3{font-size:18px;font-weight:800;margin-bottom:8px}
.modal-bx p{font-size:13px;color:var(--g500);margin-bottom:22px;white-space:pre-wrap}
.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btns .btn{font-size:13px;padding:13px}
.empty{text-align:center;padding:48px 20px;color:var(--g400);font-size:13px}
.empty .em-ico{font-size:48px;margin-bottom:10px}
.cloud-st{padding:10px 14px;border-radius:12px;font-size:12px;margin:10px 0;display:none;font-weight:600}
.cloud-st.show{display:block}
.cloud-st.ok{background:var(--green-l);color:#065f46}
.cloud-st.err{background:var(--rose-l);color:var(--rose)}
.cloud-st.loading{background:var(--amber-l);color:#92400e}
.org-tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.org-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--g200);background:var(--g0);color:var(--g600);cursor:pointer;white-space:nowrap;transition:.2s;flex-shrink:0}
.org-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.color-grid{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.color-sw{width:36px;height:36px;border-radius:12px;cursor:pointer;border:3px solid transparent;transition:.2s;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.color-sw.on{border-color:var(--g800);transform:scale(1.15)}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;margin:2px;background:var(--accent-l);color:var(--accent)}
.backup-banner{background:linear-gradient(135deg,var(--amber-l),#fef3c7);border:1.5px solid var(--amber);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:12px;font-weight:600;color:#92400e}
.star-btn{background:none;border:none;font-size:24px;cursor:pointer;padding:2px;transition:.15s}
.star-btn:active{transform:scale(.8)}
.cues-display{white-space:pre-wrap;font-size:13px;color:#78350f;line-height:1.6}
.class-ico{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.stu-ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent-l),#ddd6fe);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--accent);flex-shrink:0}
.prog-bar{height:6px;background:var(--g100);border-radius:6px;overflow:hidden;margin:8px 0}
.prog-fill{height:100%;border-radius:6px;transition:width .4s var(--ease)}
.tl-line{position:relative;padding-left:24px;margin:6px 0}
.tl-line::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--g200)}
.tl-dot{position:absolute;left:3px;top:6px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.skill-tree-wrap{position:relative;width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,#0f0f23 0%,#1a1a3e 50%,#0d1b2a 100%);border-radius:20px;min-height:300px;padding:20px;margin-bottom:12px}
.skill-tree-wrap svg{display:block}
.sk-node{cursor:pointer;transition:transform .2s}
.sk-node:hover{transform:scale(1.15)}
.sk-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:var(--g0);border-radius:12px}
.sk-legend-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--g600)}
.sk-legend-dot{width:12px;height:12px;border-radius:50%}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-ov" id="mo"><div class="modal-bx"><h3 id="mT"></h3><p id="mM"></p><div class="modal-btns"><button class="btn btn-outline" onclick="closeMo()">取消</button><button class="btn btn-danger" id="mC">確定</button></div></div></div>

<script>
const CLOUD_URL='https://script.google.com/macros/s/AKfycby_8wGX3bDydGURkL5LvtDy_IQpfAZpfScorO1ZDBI-7K-uvZxT4U5cGF-nW5z0PgAnWg/exec';
const CLOUD_TOKEN='mySecret2026';
const CLOUD_FILE='lesson_plan_v1.txt';
const LEVELS=['未接觸','需要提示','偶爾成功','基本掌握','穩定完成','可示範'];
const CATS={rope:{name:'跳繩',emoji:'🪢'},gym:{name:'體操',emoji:'🤸'},mixed:{name:'混合',emoji:'🔀'}};
const DIFF_LABELS={simplified:'🟡 簡化',basic:'🔵 基礎',standard:'🟢 標準',challenge:'🔴 挑戰'};
const ATT_STATUSES=[
{id:'present',label:'✅ 出席',c:'var(--green)',bg:'var(--green-l)'},
{id:'late',label:'⏰ 遲到',c:'var(--amber)',bg:'var(--amber-l)'},
{id:'absent',label:'❌ 缺席',c:'var(--rose)',bg:'var(--rose-l)'},
{id:'excused',label:'📝 請假',c:'var(--blue)',bg:'var(--blue-l)'}];
const CL_COLORS=[
{id:'navy',c:'#0f3460'},{id:'purple',c:'#6c5ce7'},{id:'blue',c:'#4a7dff'},{id:'indigo',c:'#6366f1'},
{id:'teal',c:'#14b8a6'},{id:'green',c:'#10b981'},{id:'lime',c:'#84cc16'},{id:'amber',c:'#f59e0b'},
{id:'orange',c:'#f97316'},{id:'red',c:'#ef4444'},{id:'rose',c:'#f43f5e'},{id:'pink',c:'#ec4899'}];
const SEG_TEMPLATES={
rope:[{name:'集合及目標介紹',duration:5,desc:'講解今堂目標及示範'},{name:'熱身跳繩',duration:5,desc:'自由跳、開合跳'},{name:'前置技能重溫',duration:8,desc:''},{name:'主學習活動',duration:15,desc:''},{name:'組合練習',duration:10,desc:''},{name:'挑戰／小作品',duration:8,desc:''},{name:'回顧',duration:4,desc:''}],
gym:[{name:'集合及目標介紹',duration:5,desc:''},{name:'熱身及柔軟度',duration:8,desc:''},{name:'基礎體能',duration:8,desc:''},{name:'主學習活動',duration:15,desc:''},{name:'組合練習',duration:10,desc:''},{name:'挑戰',duration:7,desc:''},{name:'回顧及拉筋',duration:7,desc:''}],
mixed:[{name:'集合及目標介紹',duration:5,desc:''},{name:'熱身',duration:5,desc:''},{name:'跳繩技能',duration:12,desc:''},{name:'體操技能',duration:12,desc:''},{name:'綜合練習',duration:10,desc:''},{name:'小作品',duration:8,desc:''},{name:'回顧',duration:5,desc:''}]
};

let ORGS=[],CLASSES=[],PLANS=[],TEMPLATES=[],STUDENTS=[],INVOICES=[],FRAMEWORKS=[],PRODUCTS=[],ARTICLES=[];
let BRAND={name:'',phone:'',fps:'',payme:'',whatsapp:'',paymeQR:'',fpsQR:'',driveFolderId:'',policy:'• 場地預約後不設退款\n• 繳交學費時請假 → 獲堂數扣減，不設補堂\n• 繳交學費後請假（如病假）→ 獲半數退款，不設補堂'};
const SC=[{id:'none',label:'未接觸',color:'#d4d4d4',bg:'#f5f5f5',emoji:'⚪'},{id:'red',label:'需要協助',color:'#dc2626',bg:'#fef2f2',emoji:'🔴'},{id:'orange',label:'需要提示',color:'#ea580c',bg:'#fff7ed',emoji:'🟠'},{id:'yellow',label:'偶爾成功',color:'#d97706',bg:'#fefce8',emoji:'🟡'},{id:'green',label:'穩定掌握',color:'#16a34a',bg:'#f0fdf4',emoji:'🟢'},{id:'blue',label:'可示範',color:'#2563eb',bg:'#eff6ff',emoji:'🔵'}];
let S={tab:'classes',page:'home',selClass:null,selPlan:null,teachSeg:0,editPlanId:null,segOpen:{},planTab:'current',attBack:'home',selOrg:'',selStudentId:null,fromBackup:false,selInv:null,selFw:null,selSkill:null,selProduct:null,selArticle:null,planMonth:'',reflectMonth:'',selReward:null};

function uid(){return Date.now().toString(36)+Math.random().toString(36).substr(2,5)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function nlbr(s){return esc(s).replace(/\n/g,'<br>')}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function dateStr(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function p2(n){return String(n).padStart(2,'0')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function showMo(t,m,cb,ok){document.getElementById('mT').textContent=t;document.getElementById('mM').textContent=m;var b=document.getElementById('mC');b.textContent=ok||'確定';b.onclick=()=>{closeMo();cb()};document.getElementById('mo').classList.add('show')}
function closeMo(){document.getElementById('mo').classList.remove('show')}
function copyTxt(t){navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('已複製')).catch(()=>toast('複製失敗')):function(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);toast('已複製')}()}
function getClass(id){return CLASSES.find(c=>c.id===id)}
function getPlan(id){return PLANS.find(p=>p.id===id)}
function getClassPlans(cid){return PLANS.filter(p=>p.classId===cid)}
function getClsColor(c){var cid=c.color||'navy';var cc=CL_COLORS.find(x=>x.id===cid);return cc?cc.c:'#0f3460'}
function getOrgName(oid){var o=ORGS.find(x=>x.id===oid);return o?o.name:''}
var REWARDS=[];
function buildSave(){return{v:'10',savedAt:nowStr(),orgs:ORGS,classes:CLASSES,plans:PLANS,templates:TEMPLATES,students:STUDENTS,invoices:INVOICES,frameworks:FRAMEWORKS,brand:BRAND,products:PRODUCTS,articles:ARTICLES,rewards:REWARDS}}
function applyLoad(d){ORGS=d.orgs||[];CLASSES=d.classes||[];PLANS=d.plans||[];TEMPLATES=d.templates||[];STUDENTS=d.students||[];INVOICES=d.invoices||[];FRAMEWORKS=d.frameworks||[];if(d.brand)BRAND=Object.assign(BRAND,d.brand);if(d.products)PRODUCTS=d.products;if(d.articles)ARTICLES=d.articles;if(d.rewards)REWARDS=d.rewards}

function cloudSave(){if(!CLOUD_URL)return;var el=document.getElementById('cloudSt');if(el){el.className='cloud-st show loading';el.textContent='☁️ 儲存中…'}var act=S.fromBackup?'restore':'save';fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,file:CLOUD_FILE,data:JSON.stringify(buildSave()),action:act})}).then(r=>r.json()).then(res=>{if(el){el.className='cloud-st show '+(res.ok?'ok':'err');el.textContent=res.ok?'✅ 已儲存 · '+nowStr():'❌ 錯誤'}if(res.ok){toast(S.fromBackup?'✅ 已從備份還原並儲存':'✅ 已儲存');S.fromBackup=false}}).catch(()=>{if(el){el.className='cloud-st show err';el.textContent='❌ 連接失敗'}})}
function cloudLoad(cb){if(!CLOUD_URL){if(cb)cb();return}fetch(CLOUD_URL+'?token='+encodeURIComponent(CLOUD_TOKEN)+'&file='+encodeURIComponent(CLOUD_FILE)).then(r=>r.json()).then(res=>{if(res.ok){try{applyLoad(JSON.parse(res.data));S.fromBackup=false}catch(e){}}if(cb)cb();R()}).catch(()=>{if(cb)cb();R()})}
function cloudLoadBackup(type){toast('📥 讀取中…');var labels={'6h':'6小時前','daily':'1日前','weekly':'7日前'};if(type==='latest'){cloudLoad(function(){S.fromBackup=false;toast('✅ 已載入最新版本')});return}var url=CLOUD_URL+'?token='+encodeURIComponent(CLOUD_TOKEN)+'&file='+encodeURIComponent(CLOUD_FILE)+'&action=readBackup&backup='+type;fetch(url).then(r=>r.json()).then(res=>{if(res.ok){try{applyLoad(JSON.parse(res.data));S.fromBackup=true;toast('✅ 已載入'+labels[type]+'備份');R()}catch(e){toast('❌ 資料格式錯誤')}}else{toast('❌ '+(res.msg||'備份未建立'))}}).catch(()=>toast('❌ 連接失敗'))}

function isPresent(pid,sid){var p=getPlan(pid);if(!p||!p.attendance||!p.attendance[sid]||!p.attendance[sid].status)return true;var st=p.attendance[sid].status;return st==='present'||st==='late'}
function getAttStats(pid,students){var p=getPlan(pid);var att=(p&&p.attendance)||{};var s={present:0,late:0,absent:0,excused:0,unmarked:0,total:students.length};students.forEach(function(st){var a=att[st.id];if(!a||!a.status)s.unmarked++;else if(s.hasOwnProperty(a.status))s[a.status]++});s.here=s.present+s.late;return s}
function getStuAttRate(cid,sid){var plans=getClassPlans(cid);var total=0,here=0;plans.forEach(function(p){if(p.attendance&&p.attendance[sid]&&p.attendance[sid].status){total++;if(p.attendance[sid].status==='present'||p.attendance[sid].status==='late')here++}});return{total:total,here:here,rate:total>0?Math.round(here/total*100):null}}
function setAtt(pid,sid,status){var p=getPlan(pid);if(!p)return;if(!p.attendance)p.attendance={};if(!p.attendance[sid])p.attendance[sid]={status:'',notes:''};p.attendance[sid].status=p.attendance[sid].status===status?'':status;R()}
function setAttNote(pid,sid,note){var p=getPlan(pid);if(!p)return;if(!p.attendance)p.attendance={};if(!p.attendance[sid])p.attendance[sid]={status:'',notes:''};p.attendance[sid].notes=note}
function markAllPresent(pid){var p=getPlan(pid);if(!p)return;var c=getClass(p.classId);if(!c||!c.students)return;if(!p.attendance)p.attendance={};c.students.forEach(function(st){if(!p.attendance[st.id])p.attendance[st.id]={status:'',notes:''};p.attendance[st.id].status='present'});R()}
function clearAllAtt(pid){var p=getPlan(pid);if(!p)return;p.attendance={};R()}
function goBackFromAtt(){if(S.attBack==='planBuilder'){S.page='planBuilder';R()}else if(S.attBack==='teachMode'){S.page='teachMode';R()}else if(S.attBack==='classDetail'){S.page='classDetail';R()}else{S.page='home';S.tab='classes';R()}}
function getStuPerf(cid,sid){var plans=getClassPlans(cid);var recs=[];plans.forEach(function(p){if(p.reflection&&p.reflection.studentResults&&p.reflection.studentResults[sid]){var sr=p.reflection.studentResults[sid];recs.push({date:p.date,pid:p.id,result:sr.result||'',notes:sr.notes||'',next:sr.next||''})}});return recs}
function saveAsTemplate(pid){var p=getPlan(pid);if(!p)return;var name=prompt('Template名稱：');if(!name||!name.trim())return;TEMPLATES.push({id:uid(),name:name.trim(),category:getClass(p.classId)?getClass(p.classId).category:'mixed',goals:JSON.parse(JSON.stringify(p.goals||[])),segments:JSON.parse(JSON.stringify(p.segments||[])),createdAt:nowStr()});cloudSave();toast('✅ 已儲存為Template');R()}
function loadTemplate(tid,pid){var tpl=TEMPLATES.find(t=>t.id===tid);var p=getPlan(pid);if(!tpl||!p)return;p.goals=JSON.parse(JSON.stringify(tpl.goals));p.segments=JSON.parse(JSON.stringify(tpl.segments));p.segments.forEach(s=>{s.id=uid();s.studentTasks={}});S.segOpen={};toast('✅ 已載入Template');R()}
function delTemplate(tid){showMo('刪除','確定刪除此Template？',function(){TEMPLATES=TEMPLATES.filter(t=>t.id!==tid);cloudSave();R()},'刪除')}
function gSC(id){return SC.find(s=>s.id===id)||SC[0]}
function gStu(id){var s=STUDENTS.find(s=>s.id===id);if(s)return s;for(var i=0;i<CLASSES.length;i++){if(CLASSES[i].students){var f=CLASSES[i].students.find(s=>s.id===id);if(f)return f}}return null}
function gInv(id){return INVOICES.find(i=>i.id===id)}
function gFw(id){return FRAMEWORKS.find(f=>f.id===id)}
function gStuSP(sid,skId){var st=gStu(sid);if(!st||!st.skillProgress)return null;return st.skillProgress[skId]||null}
function setStuSP(sid,skId,status){var st=gStu(sid);if(!st)return;if(!st.skillProgress)st.skillProgress={};if(!st.skillProgress[skId])st.skillProgress[skId]={status:'none',timeline:[]};st.skillProgress[skId].status=status}
function addTimeline(sid,skId,entry){var st=gStu(sid);if(!st)return;if(!st.skillProgress)st.skillProgress={};if(!st.skillProgress[skId])st.skillProgress[skId]={status:'none',timeline:[]};entry.id=uid();st.skillProgress[skId].timeline.push(entry);st.skillProgress[skId].status=entry.status}
function fwProgress(sid,fw){var total=0,done=0;(fw.levels||[]).forEach(lv=>{(lv.skills||[]).forEach(sk=>{total++;var sp=gStuSP(sid,sk.id);if(sp&&(sp.status==='green'||sp.status==='blue'))done++;(sk.variations||[]).forEach(v=>{total++;var vp=gStuSP(sid,v.id);if(vp&&(vp.status==='green'||vp.status==='blue'))done++})})});return{total:total,done:done,pct:total>0?Math.round(done/total*100):0}}
function getStuShareLink(sid){
  return CLOUD_URL+'?stuId='+sid;
}

h+='<div class="m-card m-card-hover fade-in" style="cursor:pointer;animation-delay:'+(ci*50)+'ms" onclick="S.selClass=\''+c.id+'\';S.page=\'classDetail\';R()"><div style="display:flex;align-items:center;gap:14px">';

    if(c.maxStudents)h+='<div style="font-size:12px;color:var(--g600);margin:4px 0">👥 名額：'+c.maxStudents+'人'+(c.students?' (已有'+c.students.length+'人)':'')+'</div>';

    h+='<button class="btn btn-xs btn-accent" style="margin-top:10px" onclick="shareClassInfo(\''+c.id+'\')">📤 分享班別資訊</button>';

tus===s2.id?'var(--g800)':'transparent')+'" onclick="setStuSP(\''+st.id+'\',\''+v.id+'\',\''+s2.id+'\');cloudSave();R()"></div>'});h+='</div></div>'});h+='</div>'}h+='<div class="m-card"><div style="font-size:13px;font-weight:700;margin-bottom:8px">📹 時間線</div>';h+='<div style="background:var(--accent-l);border-radius:12px;padding:10px;margin-bottom:8px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px"><input type="date" id="tlDate" class="m-input" value="'+dateStr()+'" style="font-size:10px;padding:5px"><select id="tlStatus" class="m-select" style="font-size:10px;padding:5px">';SC.forEach(s=>{h+='<option value="'+s.id+'"'+(s.id===sp.status?' selected':'')+'>'+s.emoji+' '+s.label+'</option>'});h+='</select></div><input id="tlUrl" class="m-input" placeholder="影片link" style="font-size:10px;padding:5px;margin-bottom:3px"><input id="tlNote" class="m-input" placeholder="備註" style="font-size:10px;padding:5px;margin-bottom:4px"><button class="btn btn-xs btn-accent" onclick="addTimeline(\''+st.id+'\',\''+skill.id+'\',{date:document.getElementById(\'tlDate\').value,status:document.getElementById(\'tlStatus\').value,videoUrl:document.getElementById(\'tlUrl\').value,note:document.getElementById(\'tlNote\').value});cloudSave();R()">＋ 加入</button></div>';if(sp.timeline&&sp.timeline.length){h+='<div class="tl-line">';sp.timeline.slice().reverse().forEach(tl=>{var tc=gSC(tl.status);h+='<div style="margin-bottom:10px;position:relative"><div class="tl-dot" style="background:'+tc.color+'"></div><div style="font-size:10px;font-weight:700">'+esc(tl.date)+' <span style="color:'+tc.color+'">'+tc.emoji+'</span></div>';if(tl.note)h+='<div style="font-size:10px;color:var(--g600)">'+esc(tl.note)+'</div>';if(tl.videoUrl)h+='<a href="'+esc(tl.videoUrl)+'" target="_blank" style="font-size:10px;color:var(--accent)">▶ 影片</a>';h+='</div>'});h+='</div>'}h+='</div>';return h}
function uploadClassIcon(cid){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){toast('上傳中...');fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,action:'uploadImage',imageData:reader.result.split(',')[1],imageName:'class_'+cid+'.png',mimeType:file.type,imgFolder:'CRE_Images'})}).then(function(r){return r.json()}).then(function(res){if(res.ok){var cl=getClass(cid);if(cl)cl.iconUrl=res.thumb||res.url;cloudSave();R()}else toast('❌')}).catch(function(){toast('❌')})};reader.readAsDataURL(file)};input.click()}
function uploadQR(type){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){toast('上傳中...');fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,action:'uploadImage',imageData:reader.result.split(',')[1],imageName:type+'_qr.png',mimeType:file.type,imgFolder:'CRE_Images'})}).then(r=>r.json()).then(res=>{if(res.ok){if(type==='payme')BRAND.paymeQR=res.thumb||res.url;else BRAND.fpsQR=res.thumb||res.url;cloudSave();R()}else toast('❌')}).catch(()=>toast('❌'))};reader.readAsDataURL(file)};input.click()}
function calcTreeLayout(fw){var nodes=[],edges=[];(fw.levels||[]).forEach(function(lv,li){var skills=lv.skills||[];var centerX=200;var levelWidth=skills.length*100;var startX=centerX-levelWidth/2+50;skills.forEach(function(sk,si){var nx=startX+si*100;var ny=80+li*120;nodes.push({id:sk.id,name:sk.name,x:nx,y:ny,level:li,skill:sk});if(li>0){var prevLv=fw.levels[li-1];(prevLv.skills||[]).forEach(function(psk){edges.push({from:psk.id,to:sk.id})})}(sk.variations||[]).forEach(function(v,vi){var vx=nx+(vi-(sk.variations.length-1)/2)*50;var vy=ny+50;nodes.push({id:v.id,name:v.name,x:vx,y:vy,level:li,isVar:true,parent:sk.id});edges.push({from:sk.id,to:v.id})})})});return{nodes:nodes,edges:edges}}
function renderSkillTree(fw,studentId){var layout=calcTreeLayout(fw);var nodes=layout.nodes;var edges=layout.edges;var maxX=0,maxY=0;nodes.forEach(function(n){if(n.x>maxX)maxX=n.x;if(n.y>maxY)maxY=n.y});var svgW=Math.max(400,maxX+100);var svgH=Math.max(300,maxY+100);var h='<div class="skill-tree-wrap" style="min-height:'+(svgH+40)+'px">';h+='<svg width="'+svgW+'" height="'+svgH+'" viewBox="0 0 '+svgW+' '+svgH+'">';h+='<defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';edges.forEach(function(e){var fromN=nodes.find(function(n){return n.id===e.from});var toN=nodes.find(function(n){return n.id===e.to});if(!fromN||!toN)return;var sp=gStuSP(studentId,toN.id);var status=sp?sp.status:'none';var lineColor=status==='green'||status==='blue'?'#10b981':status==='yellow'?'#d97706':status==='orange'||status==='red'?'#ea580c':'rgba(255,255,255,.15)';var lineWidth=status==='green'||status==='blue'?3:1.5;h+='<line x1="'+fromN.x+'" y1="'+fromN.y+'" x2="'+toN.x+'" y2="'+toN.y+'" stroke="'+lineColor+'" stroke-width="'+lineWidth+'" stroke-linecap="round"/>'});nodes.forEach(function(n){var sp=gStuSP(studentId,n.id);var status=sp?sp.status:'none';var sc=gSC(status);var r=n.isVar?14:22;var strokeW=n.isVar?2:3;var fillColor=status==='none'?'rgba(255,255,255,.05)':sc.color+'33';var strokeColor=sc.color;var textColor=status==='none'?'rgba(255,255,255,.4)':'#fff';var filter=(status==='green'||status==='blue')?' filter="url(#glow)"':'';h+='<g class="sk-node" onclick="openSkillNode(\''+n.id+'\')"'+filter+'>';h+='<circle cx="'+n.x+'" cy="'+n.y+'" r="'+r+'" fill="'+fillColor+'" stroke="'+strokeColor+'" stroke-width="'+strokeW+'"/>';if(!n.isVar)h+='<text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" fill="'+textColor+'" font-size="10" font-weight="700">'+esc(n.name.substring(0,2))+'</text>';h+='<text x="'+n.x+'" y="'+(n.y+r+14)+'" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="9" font-weight="600">'+esc(n.name.length>6?n.name.substring(0,6)+'..':n.name)+'</text>';h+='</g>'});h+='</svg></div>';h+='<div class="sk-legend">';SC.forEach(function(s){h+='<div class="sk-legend-item"><div class="sk-legend-dot" style="background:'+s.color+'"></div>'+s.label+'</div>'});h+='</div>';return h}
function openSkillNode(skId){S.selSkill=skId;FRAMEWORKS.forEach(function(fw){(fw.levels||[]).forEach(function(lv){(lv.skills||[]).forEach(function(sk){if(sk.id===skId)S.selFw=fw.id;(sk.variations||[]).forEach(function(v){if(v.id===skId){S.selFw=fw.id;S.selSkill=skId}})})})});S.page='skillDetail';R()}

function pgProductEdit(){var prod=PRODUCTS.find(p=>p.id===S.selProduct);if(!prod){S.page='home';S.tab='content';return''}var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button class="pg-back" onclick="S.page=\'home\';S.tab=\'content\';R()">‹</button><div style="flex:1;font-size:18px;font-weight:800">編輯商品</div></div>';h+='<div class="m-card">';h+='<label class="label">商品名稱</label><input class="m-input" value="'+esc(prod.name)+'" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').name=this.value" style="margin-bottom:10px">';h+='<label class="label">價錢 ($)</label><input type="number" class="m-input" value="'+(prod.price||0)+'" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').price=parseInt(this.value)||0" style="margin-bottom:10px">';h+='<label class="label">描述</label><textarea class="m-textarea" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').description=this.value" style="margin-bottom:10px">'+esc(prod.description||'')+'</textarea>';h+='<label class="label">尺碼（逗號分隔）</label><input class="m-input" value="'+esc(prod.sizes||'')+'" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').sizes=this.value" placeholder="S,M,L,XL" style="margin-bottom:10px">';h+='<label class="label">圖片</label><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';if(prod.image)h+='<img src="'+esc(prod.image)+'" style="width:60px;height:60px;border-radius:8px;object-fit:cover">';h+='<button class="btn btn-xs btn-outline" onclick="uploadProductImg(\''+prod.id+'\')">📷 上載</button>';if(prod.image)h+='<button class="btn btn-xs" style="background:var(--rose-l);color:var(--rose)" onclick="PRODUCTS.find(p=>p.id===\''+prod.id+'\').image=\'\';R()">✕</button>';h+='</div>';h+='<label class="label">購買連結</label><input class="m-input" value="'+esc(prod.orderLink||'')+'" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').orderLink=this.value" placeholder="https://..." style="margin-bottom:10px">';h+='<label class="label">WhatsApp</label><input class="m-input" value="'+esc(prod.whatsapp||'')+'" onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').whatsapp=this.value" placeholder="852XXXXXXXX" style="margin-bottom:10px">';h+='<div style="display:flex;gap:10px;margin-bottom:10px"><label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600"><input type="checkbox" '+(prod.featured?'checked':'')+' onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').featured=this.checked"> ⭐ 推薦</label><label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600"><input type="checkbox" '+(prod.visible!==false?'checked':'')+' onchange="PRODUCTS.find(p=>p.id===\''+prod.id+'\').visible=this.checked"> 👁 顯示</label></div>';h+='<button class="btn btn-dark" style="margin-bottom:8px" onclick="cloudSave()">💾 儲存</button>';h+='<button class="btn btn-danger" onclick="showMo(\'刪除\',\'確定？\',function(){PRODUCTS=PRODUCTS.filter(p=>p.id!==\''+prod.id+'\');cloudSave();S.page=\'home\';S.tab=\'content\';R()},\'刪除\')">🗑 刪除</button>';h+='</div>';return h}
function pgArticleEdit(){var art=ARTICLES.find(a=>a.id===S.selArticle);if(!art){S.page='home';S.tab='content';return''}var h='<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button class="pg-back" onclick="S.page=\'home\';S.tab=\'content\';R()">‹</button><div style="flex:1;font-size:18px;font-weight:800">編輯文章</div></div>';h+='<div class="m-card">';h+='<label class="label">標題</label><input class="m-input" value="'+esc(art.title)+'" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').title=this.value" style="margin-bottom:10px">';h+='<label class="label">分類</label><select class="m-select" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').category=this.value" style="margin-bottom:10px"><option value="">— 選擇分類 —</option>';

h+='</select>';h+='<label class="label">日期</label><input type="date" class="m-input" value="'+esc(art.date||'')+'" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').date=this.value" style="margin-bottom:10px">';h+='<label class="label">摘要</label><input class="m-input" value="'+esc(art.excerpt||'')+'" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').excerpt=this.value" style="margin-bottom:10px">';h+='<label class="label">內容</label><textarea class="m-textarea" style="min-height:200px;margin-bottom:10px" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').content=this.value">'+esc(art.content||'')+'</textarea>';h+='<label class="label">影片連結</label><input class="m-input" value="'+esc(art.videoUrl||'')+'" onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').videoUrl=this.value" style="margin-bottom:10px">';h+='<label class="label">封面圖</label><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';if(art.cover)h+='<img src="'+esc(art.cover)+'" style="width:80px;height:45px;border-radius:8px;object-fit:cover">';h+='<button class="btn btn-xs btn-outline" onclick="uploadArticleCover(\''+art.id+'\')">📷 上載</button>';if(art.cover)h+='<button class="btn btn-xs" style="background:var(--rose-l);color:var(--rose)" onclick="ARTICLES.find(a=>a.id===\''+art.id+'\').cover=\'\';R()">✕</button>';h+='</div>';h+='<label style="display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-bottom:10px"><input type="checkbox" '+(art.published!==false?'checked':'')+' onchange="ARTICLES.find(a=>a.id===\''+art.id+'\').published=this.checked"> 📢 發佈</label>';h+='<button class="btn btn-dark" style="margin-bottom:8px" onclick="cloudSave()">💾 儲存</button>';h+='<button class="btn btn-danger" onclick="showMo(\'刪除\',\'確定？\',function(){ARTICLES=ARTICLES.filter(a=>a.id!==\''+art.id+'\');cloudSave();S.page=\'home\';S.tab=\'content\';R()},\'刪除\')">🗑 刪除</button>';h+='</div>';return h}
function uploadProductImg(pid){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){toast('上傳中...');fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,action:'uploadImage',imageData:reader.result.split(',')[1],imageName:'prod_'+pid+'.png',mimeType:file.type,imgFolder:'CRE_Images'})}).then(r=>r.json()).then(res=>{if(res.ok){var p=PRODUCTS.find(x=>x.id===pid);if(p)p.image=res.thumb||res.url;cloudSave();R()}else toast('❌')}).catch(()=>toast('❌'))};reader.readAsDataURL(file)};input.click()}
function uploadArticleCover(aid){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(){var file=input.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){toast('上傳中...');fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({token:CLOUD_TOKEN,action:'uploadImage',imageData:reader.result.split(',')[1],imageName:'art_'+aid+'.png',mimeType:file.type,imgFolder:'CRE_Images'})}).then(r=>r.json()).then(res=>{if(res.ok){var a=ARTICLES.find(x=>x.id===aid);if(a)a.cover=res.thumb||res.url;cloudSave();R()}else toast('❌')}).catch(()=>toast('❌'))};reader.readAsDataURL(file)};input.click()}

function shareClassInfo(cid){
  var c=getClass(cid);if(!c)return;
  var t='';
  t+='📋 *'+c.name+'*\n';
  if(c.coachTitle)t+='👨‍🏫 教練：'+c.coachTitle+'\n';
  if(c.classType)t+='📌 '+c.classType+'\n';
  t+='\n';
  if(c.schedule)t+='🕐 '+c.schedule+'\n';
  if(c.location)t+='📍 '+c.location+'\n';
  if(c.fee)t+='💰 $'+c.fee+'/堂'+(c.feeNote?' ('+c.feeNote+')':'')+'\n';
  if(c.suitableLevel)t+='\n📊 適合程度：'+c.suitableLevel+'\n';
  if(c.maxStudents)t+='👥 名額：'+c.maxStudents+'人\n';
  if(c.description)t+='\n'+c.description+'\n';
  t+='\n——————————————\n';
  if(c.coachPhone)t+='📞 聯絡/報名：https://wa.me/'+c.coachPhone+'\n';
  else if(BRAND.whatsapp)t+='📞 聯絡/報名：https://wa.me/'+BRAND.whatsapp+'\n';
  copyTxt(t);
}

function uploadClassCover(cid){
  var input=document.createElement('input');
  input.type='file';input.accept='image/*';
  input.onchange=function(){
    var file=input.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(){
      toast('上傳中...');
      fetch(CLOUD_URL,{method:'POST',body:JSON.stringify({
        token:CLOUD_TOKEN,action:'uploadImage',
        imageData:reader.result.split(',')[1],
        imageName:'cover_'+cid+'.png',
        mimeType:file.type,imgFolder:'CRE_Images'
      })}).then(r=>r.json()).then(res=>{
        if(res.ok){var cl=getClass(cid);if(cl)cl.coverUrl=res.thumb||res.url;cloudSave();R()}
        else toast('❌')
      }).catch(()=>toast('❌'));
    };reader.readAsDataURL(file);
  };input.click();
}

function editReward(rwId){var rw=REWARDS.find(r=>r.id===rwId);if(!rw)return;var app=document.getElementById('app');var h='<div class="container" style="padding-top:16px"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px"><button class="pg-back" onclick="S.page=\'home\';S.tab=\'content\';R()">‹</button><div style="flex:1;font-size:18px;font-weight:800">⭐ 編輯獎勵</div></div>';h+='<div class="m-card">';h+='<div style="display:grid;grid-template-columns:70px 1fr;gap:8px;margin-bottom:10px"><div><label class="label">Emoji</label><input class="m-input" id="rwEmoji" value="'+esc(rw.emoji||'⭐')+'" style="font-size:22px;text-align:center;padding:8px"></div><div><label class="label">獎勵名稱</label><input class="m-input" id="rwTitle" value="'+esc(rw.title)+'"></div></div>';h+='<label class="label">描述</label><textarea class="m-textarea" id="rwDesc" style="margin-bottom:10px">'+esc(rw.description||'')+'</textarea>';h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px"><div><label class="label">開始日期</label><input type="date" class="m-input" id="rwDate" value="'+esc(rw.date||'')+'"></div><div><label class="label">結束日期</label><input type="date" class="m-input" id="rwEnd" value="'+esc(rw.endDate||'')+'"></div></div>';h+='<label class="label">獎品</label><input class="m-input" id="rwPrize" value="'+esc(rw.prize||'')+'" placeholder="例如：送跳繩一條" style="margin-bottom:10px">';h+='<label class="label">挑戰任務</label>';(rw.tasks||[]).forEach(function(t,i){h+='<div style="display:flex;gap:4px;margin-bottom:4px"><input class="m-input" value="'+esc(t.desc)+'" onchange="REWARDS.find(r=>r.id===\''+rw.id+'\').tasks['+i+'].desc=this.value" style="font-size:12px;flex:1" placeholder="任務描述"><button style="background:none;border:none;color:var(--rose);cursor:pointer" onclick="REWARDS.find(r=>r.id===\''+rw.id+'\').tasks.splice('+i+',1);editReward(\''+rw.id+'\')">✕</button></div>'});h+='<button class="btn btn-xs btn-outline" style="margin-bottom:10px" onclick="REWARDS.find(r=>r.id===\''+rw.id+'\').tasks.push({id:uid(),desc:\'\',required:true});editReward(\''+rw.id+'\')">＋ 加任務</button>';h+='<div style="margin-bottom:10px"><label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600"><input type="checkbox" id="rwActive" '+(rw.active?'checked':'')+'>🟢 進行中（學生可見）</label></div>';h+='<button class="btn btn-dark" style="margin-bottom:8px" onclick="saveReward(\''+rw.id+'\')">💾 儲存</button>';h+='<button class="btn btn-danger" onclick="REWARDS=REWARDS.filter(r=>r.id!==\''+rw.id+'\');cloudSave();S.page=\'home\';S.tab=\'content\';R()">🗑 刪除</button>';h+='</div></div>';app.innerHTML=h+btmNav()}
function saveReward(rwId){var rw=REWARDS.find(r=>r.id===rwId);if(!rw)return;rw.emoji=document.getElementById('rwEmoji').value.trim()||'⭐';rw.title=document.getElementById('rwTitle').value.trim();rw.description=document.getElementById('rwDesc').value;rw.date=document.getElementById('rwDate').value;rw.endDate=document.getElementById('rwEnd').value;rw.prize=document.getElementById('rwPrize').value.trim();rw.active=document.getElementById('rwActive').checked;cloudSave();toast('✅ 已儲存');S.page='home';S.tab='content';R()}
